q37:{type:'multi',need:2,pg:[3],prompt:"Which are part of labor laws compliance? (Choose 2)",
 choices:["Minimum wage compliance","SSS, PhilHealth, Pag-IBIG benefits","Winning the certification election","Choosing the bargaining agent"],ans:[0,1],why:"Compliance = following gov't labor rules: wages, hours, benefits, termination, safety."},
m2:{type:'match',pg:[4],prompt:"Match the memory tips",pairs:[["Unionization","Form the team"],["Certification election","Pick the leader"],["Bargaining unit","Who's inside"],["CBA","Final contract"],["Grievance","Complaint box"]],
 why:"Straight from the notes' memory tip for labor relations. Bonus: Labor Law = 'Government rules'."},

/* ================= UNIT 3: CLOCK IN ================= */
l13:{type:'learn',pg:[6],title:"Normal Hours of Work",say:"Clock in! Hours and breaks first.",
 body:"<b>Conditions of employment</b> (P.D. 442, Labor Code): the basic rules on how employees are treated: hours, pay, benefits, rights. The <b>foundation of employee protection</b>.<br><br><b>Normal hours</b> = <b>8 hours per day</b>, <b>NOT including</b> the lunch break. So it's 8 hours excluding meal, or 9 hours including a 1-hour lunch. Maximum <b>6 days per week</b> with 1 rest day.<br>Why 8? Too much work affects health, reduces productivity, increases mistakes. The law balances productivity AND welfare."},
l14:{type:'learn',pg:[6,7,'CS'],title:"Meal & Rest Periods",
 body:"<b>Standard meal break:</b> <b>60 minutes, UNPAID</b> (non-compensable), because you're not working and are free to rest or eat.<br><b>Exam favorite:</b> it can be <b>shortened to not less than 20 minutes</b>, but then it becomes <b>PAID</b>.<br>Cheat sheet: employees are entitled to <b>not less than 1 hour</b>; operations of more than 16 hours can have shorter breaks.<br><b>Rest periods of 5 to 20 minutes</b> are compensable.<br><b>Compensable working hours</b> include: hours worked, <b>waiting time</b>, <b>being on-call</b>, attendance."},
q38:{type:'single',pg:[6],prompt:"Normal hours of work under the Labor Code:",
 choices:["8 hours a day, excluding the meal break","8 hours including the meal break","10 hours a day","9 hours excluding the meal break"],ans:[0],why:"8 hours excluding meal = 9 hours including a 1-hour lunch."},
q39:{type:'single',pg:[6,7],prompt:"A standard 1-hour meal break is:",
 choices:["Non-compensable (unpaid)","Paid at 100%","Paid at 125%","Counted as overtime"],ans:[0],why:"You're free to rest or eat, so the standard 60-minute break is unpaid."},
q40:{type:'single',pg:[6,7],prompt:"The meal break is shortened to 20 minutes. It is now:",
 choices:["Paid/compensable","Still unpaid","Illegal","Counted as a rest day"],ans:[0],why:"Exam favorite: shortened meal break → becomes paid."},
q41:{type:'single',pg:[7],prompt:"The meal break can be shortened to a minimum of:",
 choices:["20 minutes","5 minutes","30 minutes","45 minutes"],ans:[0],why:"Can be reduced to 20 minutes minimum, and must then be compensated."},
q42:{type:'single',pg:['CS'],prompt:"Short rest periods of 5 to 20 minutes are:",
 choices:["Compensable working time","Unpaid","Deducted from salary","Overtime"],ans:[0],why:"Cheat sheet: rest periods of 5 to 20 minutes count as compensable hours."},
q43:{type:'multi',need:3,pg:['CS'],prompt:"Which count as compensable working hours? (Choose 3)",
 choices:["Hours worked","Waiting time","Being on-call","The regular 1-hour meal break"],ans:[0,1,2],why:"Hours worked, waiting time, and on-call are compensable. The standard 1-hour meal break isn't."},
q44:{type:'single',pg:[6],prompt:"Under normal hours, the maximum work days per week is:",
 choices:["6 days, with 1 rest day","5 days","7 days","4 days"],ans:[0],why:"Max 6 days a week, with 1 rest day."},

l15:{type:'learn',pg:[7,'CS'],title:"Night Shift Differential",
 body:"<b>NSD</b> (Art. 86): extra pay for working at night, <b>10:00 PM to 6:00 AM</b>: <b>+10% of the regular hourly wage</b> per hour.<br>Why? Night work disrupts your <b>body clock</b> (circadian rhythm), affects sleep and long-term health. The law compensates that discomfort.<br><b>Computation:</b> no. of hours × hourly rate × <b>1.10</b>.<br>Exemption (b) for NSD: retail/service establishments with <b>not more than 5 workers</b>."},
l16:{type:'learn',pg:[7,'CS'],title:"Overtime Pay",
 body:"<b>Overtime</b> (Art. 87): work <b>beyond 8 hours a day</b>. MUST be paid extra because you extend hours, sacrifice personal time, and risk fatigue.<ul><li>Ordinary day: hourly × <b>1.25</b></li><li>Rest day or special day: hourly × 1.3 × <b>1.3</b></li><li>Special day on rest day: hourly × 1.5 × 1.3</li><li>Regular holiday: hourly × 2.0 × 1.3</li><li>Regular holiday on rest day: hourly × 2.6 × 1.3</li></ul>Rule: OT on a rest day/holiday = <b>that day's rate + 30%</b>.<br>Retail/service with <b>less than 10 workers are NOT exempted</b> from OT or premium pay."},
q45:{type:'single',pg:[7],prompt:"Night shift differential covers work between:",
 choices:["10 PM and 6 AM","8 PM and 4 AM","12 MN and 8 AM","6 PM and 6 AM"],ans:[0],why:"NSD window: 10:00 PM to 6:00 AM."},
q46:{type:'single',pg:[7],prompt:"The NSD rate is:",
 choices:["+10% of regular hourly wage","+25%","+30%","+100%"],ans:[0],why:"+10% per hour. Computation: hours × hourly × 1.10."},
q47:{type:'single',pg:['CS'],prompt:"For NSD only, a retail/service establishment is exempt if it has:",
 choices:["Not more than 5 workers","Less than 10 workers","Less than 20 workers","Any number of workers"],ans:[0],why:"NSD's exemption (b) is stricter: not more than 5 workers."},
q48:{type:'single',pg:[7],prompt:"Overtime on an ordinary working day is paid at:",
 choices:["Regular hourly rate + 25%","+30%","+10%","Double"],ans:[0],why:"Ordinary day OT = hourly × 1.25."},
q49:{type:'single',pg:[7,'CS'],prompt:"Overtime on a rest day or holiday is computed as:",
 choices:["That day's rate for the first 8 hours + 30%","Ordinary rate + 25%","Always double","+10%"],ans:[0],why:"OT on premium days = the day's rate × 1.3."},
q50:{type:'single',pg:['CS'],prompt:"A retail store with 7 workers. Is it exempt from overtime and premium pay?",
 choices:["No, exemption (b) doesn't apply to OT and premium pay","Yes, it has less than 10 workers","Yes, if the owner agrees","Only from OT, not premium pay"],ans:[0],
 why:"Cheat sheet: for premium pay and OT, (b) retail/service with less than 10 workers is NOT exempted. That exemption applies to holiday pay and SIL."},
q51:{type:'single',pg:[7],prompt:"Why is overtime paid higher, per the notes?",
 choices:["You extend hours, sacrifice personal time, and may get fatigued","Because DOLE taxes it","To punish employers","To reward managers"],ans:[0],why:"The law ensures fair compensation for extra effort."},

l17:{type:'learn',pg:[8],title:"Field Personnel, Managers, No Work No Pay",
 body:"<b>Field personnel</b>: a <b>non-agricultural</b> employee who works <b>outside company premises</b> and whose <b>working hours can't be easily monitored or determined</b>. E.g., delivery riders, sales agents, field inspectors.<br><b>Managerial employees</b>: main job is <b>managing the company or a department</b>; responsible for planning, directing, supervising. They make decisions and manage people or operations.<br><b>No work, no pay</b>: if an employee doesn't work, they won't be paid. Principle: <b>'A fair day's wage for a fair day's work.'</b>"},
l18:{type:'learn',pg:[8,23,24],title:"Rest Day & Compressed Work Week",
 body:"<b>Weekly rest day:</b> <b>1 rest day after 6 consecutive workdays</b>, at least <b>24 consecutive hours</b>. Without rest, productivity drops, health suffers, burnout happens.<br>Employer can require rest-day work ONLY for: <b>emergencies</b> (fire, flood, typhoon, earthquake, epidemic), <b>urgent repairs</b> to prevent serious loss, <b>abnormal pressure of work</b>, <b>preventing loss of perishable goods</b>, <b>continuous operations</b>. Pay: <b>+30%</b>.<br><br><b>Compressed work week:</b> longer hours per day, fewer days per week (8 hrs × 6 days → <b>10 hrs × 4 days</b>). Purpose: reduce costs, save electricity, emergencies, flexible scheduling. Total weekly hours must still follow labor rules. Memory: <b>'pinagsiksik na work hours'</b>."},
q52:{type:'single',pg:[8],prompt:"Which worker is field personnel?",
 choices:["A sales agent working outside the office with unmonitored hours","A cashier at the store counter","An HR assistant in the office","A factory line worker"],ans:[0],why:"Non-agricultural, outside premises, hours can't be determined."},
q53:{type:'single',pg:[8],prompt:"'A fair day's wage for a fair day's work' is the principle behind:",
 choices:["No work, no pay","Night shift differential","13th month pay","Separation pay"],ans:[0],why:"Salary is given only for actual work done."},
q54:{type:'single',pg:[8,14],prompt:"The weekly rest day rule:",
 choices:["At least 24 consecutive hours after 6 consecutive workdays","12 hours after 5 workdays","48 hours per week","1 day per month"],ans:[0],why:"1 rest day (24 consecutive hours) after 6 workdays. Kasambahays get the same 24-hour weekly rest."},
q55:{type:'single',pg:[8],prompt:"Which is NOT a valid reason to require work on a rest day?",
 choices:["The supervisor wants to finish early for a party","Typhoon emergency","Urgent repairs to prevent serious loss","Preventing loss of perishable goods"],ans:[0],why:"Only emergencies, urgent repairs, abnormal pressure, perishable goods, or continuous operations."},
q56:{type:'single',pg:[8],prompt:"Pay for working on your rest day:",
 choices:["+30% of regular wage","+10%","+25%","No extra pay"],ans:[0],why:"Rest day work = 130% of the daily rate."},
q57:{type:'single',pg:[24],prompt:"A compressed work week means:",
 choices:["Longer hours per day, fewer days per week","Shorter days, more days","No rest day","Night shifts only"],ans:[0],why:"E.g., 10 hrs × 4 days instead of 8 hrs × 6 days."},
q58:{type:'single',pg:[24],prompt:"Which is a purpose of a compressed work week?",
 choices:["Reduce costs and save electricity","Avoid paying 13th month","Remove rest days","Skip SSS contributions"],ans:[0],why:"Purpose: reduce costs, save electricity, emergencies, flexible scheduling."},
m3:{type:'match',pg:[6,7,8],prompt:"Match the time rules",pairs:[["60-min meal break","Unpaid"],["20-min meal break","Paid"],["10 PM to 6 AM","+10% NSD"],["OT, ordinary day","+25%"],["Rest day work","+30%"]],
 why:"Short break = paid. Night = +10%. Ordinary OT = +25%. Rest day = +30%."},

/* ================= UNIT 4: HOLIDAY MODE ================= */
l19:{type:'learn',pg:[8,9,16,17,22,'CS'],title:"Regular Holiday Pay",say:"Holiday mode! Rates are exam gold.",
 body:"Regular holiday: you get paid <b>even if you don't work</b>.<ul><li>Did not work: <b>100%</b></li><li>Worked: <b>200%</b> (double)</li><li>Worked, on your rest day: <b>260%</b></li><li>Double regular, unworked: 200% · worked: <b>300%</b> · worked on rest day: <b>390%</b></li></ul>Memory: <b>'Regular holiday = double pay.'</b><br><b>To qualify:</b> you <b>worked</b> the day immediately before, OR were on <b>paid leave</b> the day before.<br><b>Regular holidays:</b> New Year's (Jan 1), Maundy Thursday, Good Friday, Eid'l Fitr, Eid'l Adha, Araw ng Kagitingan (Apr 9), Labor Day (May 1), Independence Day (June 12), National Heroes Day (last Mon of Aug), Bonifacio Day (Nov 30), Christmas (Dec 25), Rizal Day (Dec 30).",
 ex:"₱500 daily: absent but qualified → ₱500. Worked → ₱1,000. Worked on rest day → ₱1,300."},
q59:{type:'single',pg:[9,17,22],prompt:"Regular holiday. Employee did NOT work but qualified. Pay:",
 choices:["100%","0%","130%","200%"],ans:[0],why:"Regular holidays are paid even if unworked: 100%."},
q60:{type:'single',pg:[9,17,22],prompt:"Employee WORKED on a regular holiday. Pay:",
 choices:["200%","130%","100%","260%"],ans:[0],why:"Worked regular holiday = double pay (100% regular + 100% holiday)."},
q61:{type:'single',pg:[9,17,22],prompt:"Worked on a regular holiday that is also your rest day:",
 choices:["260%","200%","300%","390%"],ans:[0],why:"200% × 1.3 = 260%."},
q62:{type:'single',pg:[16,'CS'],prompt:"Which is a REGULAR holiday?",
 choices:["Araw ng Kagitingan (April 9)","Ninoy Aquino Day (Aug 21)","All Saints' Day (Nov 1)","Christmas Eve (Dec 24)"],ans:[0],why:"April 9 is regular. The other three are special non-working days."},
q63:{type:'single',pg:[9,17],prompt:"To receive regular holiday pay, the employee must have:",
 choices:["Worked or been on paid leave the day before","Worked the day after","At least 1 year of service","Signed the CBA"],ans:[0],why:"Condition: worked the day immediately before, OR on paid leave the day before."},
q64:{type:'single',pg:['CS'],prompt:"Employee WORKED on a double regular holiday (two regular holidays on one day). Pay:",
 choices:["300%","200%","260%","390%"],ans:[0],why:"Double regular: unworked 200%, worked 300%, worked on rest day 390%."},

l20:{type:'learn',pg:[9,17,22,23,'CS'],title:"Special Days & Who's Excluded",
 body:"<b>Special non-working day:</b> usually <b>'no work, no pay'</b> (unless company policy says otherwise).<ul><li>Worked: <b>130%</b></li><li>Worked on rest day: <b>150%</b></li><li>Double special worked: 150% · on rest day: <b>195%</b></li></ul>Memory: <b>'Special holiday = extra 30%.'</b><br><b>Special days:</b> Chinese New Year, Black Saturday, Ninoy Aquino Day (Aug 21), All Saints' (Nov 1), All Souls' (Nov 2), Immaculate Conception (Dec 8), Christmas Eve (Dec 24), Last Day of the Year (Dec 31).<br><br><b>No holiday pay:</b> government employees, retail/service with <b>less than 10 workers</b>, kasambahays, managerial employees, field personnel (plus officers or members of a managerial staff).",
 ex:"₱500 daily, worked on a special day → 500 × 1.3 = ₱650."},
q65:{type:'single',pg:[22,'CS'],prompt:"Special non-working day. Employee did NOT work. Pay:",
 choices:["None, 'no work, no pay' (unless company policy)","100%","130%","50%"],ans:[0],why:"Special days follow 'no work, no pay'."},
q66:{type:'single',pg:[17,22,23],prompt:"Employee WORKED on a special non-working day. Pay:",
 choices:["130%","200%","100%","150%"],ans:[0],why:"Special day = extra 30%."},
q67:{type:'single',pg:[23,'CS'],prompt:"Worked on a special day that is also your rest day:",
 choices:["150%","130%","260%","195%"],ans:[0],why:"Special + rest day = 150% (shortcut usually used in CHRA)."},
q68:{type:'single',pg:[17,'CS'],prompt:"Which is a SPECIAL non-working day?",
 choices:["Ninoy Aquino Day (Aug 21)","Bonifacio Day (Nov 30)","Rizal Day (Dec 30)","Labor Day (May 1)"],ans:[0],why:"Aug 21 is special. Bonifacio, Rizal, and Labor Day are regular."},
q69:{type:'multi',need:3,pg:[9,17],prompt:"Who does NOT get holiday pay? (Choose 3)",
 choices:["Government employees","Kasambahays","Retail/service with less than 10 workers","Rank-and-file in a 50-person factory"],ans:[0,1,2],why:"The factory worker is covered. The other three are excluded."},
q70:{type:'single',pg:['CS'],prompt:"Worked on a double special day that falls on your rest day:",
 choices:["195%","150%","260%","130%"],ans:[0],why:"Cheat sheet: worked, double special, rest day = basic × 1.95."},

l21:{type:'learn',pg:['CS'],title:"Holiday Fine Print",
 body:"<b>Absences before a holiday:</b><ul><li>Day before = leave <b>WITH pay</b> → holiday pay <b>YES</b>.</li><li>Day before = leave <b>WITHOUT pay</b> → <b>NO</b> (YES only if they work the holiday).</li><li>Day before = <b>rest day</b> → look at the day before that: <b>worked → YES</b>; absent → NO (unless they work the holiday).</li></ul><b>Successive regular holidays</b> (per notes): absent the day before + both unworked → <b>1 holiday pay only</b>. Absent the day before but <b>worked holiday 1</b> → <b>2 holiday pays</b>.<br><b>Temporary shutdown</b> (yearly inventory/maintenance): regular holidays within it <b>are compensated</b>.<br><b>Piece-rate:</b> at least the <b>average daily earnings of the last 7 work days</b>. <b>Seasonal workers:</b> not paid during off-season. <b>No regular working days:</b> still entitled."},
q71:{type:'single',pg:['CS'],prompt:"Day before the holiday: leave WITHOUT pay. Holiday unworked. Holiday pay?",
 choices:["No","Yes","Half","Yes, if it's a regular holiday"],ans:[0],why:"Leave without pay the day before = no holiday pay (unless they work the holiday)."},
q72:{type:'single',pg:['CS'],prompt:"Day before the holiday was a REST day. The day before that, the employee worked. Holiday unworked. Holiday pay?",
 choices:["Yes","No","Half only","Only if it's a special day"],ans:[0],why:"If the day before is a rest day, check the day before it. Worked → yes."},
q73:{type:'single',pg:['CS'],prompt:"Successive regular holidays (Maundy Thu + Good Fri). Absent the day before, but WORKED Maundy Thursday. Per the notes:",
 choices:["2 holiday pays","No holiday pay","1 holiday pay only","3 holiday pays"],ans:[0],why:"Notes table: absent + worked holiday 1 → 2 holiday pays. Heads-up: the DOLE handbook says that if both holidays are unworked after an absence, neither is paid."},
q74:{type:'single',pg:['CS'],prompt:"Regular holidays that fall within a temporary shutdown for yearly inventory are:",
 choices:["Compensated","Unpaid","Converted to SIL","Deducted from salary"],ans:[0],why:"Regular holidays during a temporary or periodic shutdown are still compensated."},
q75:{type:'single',pg:['CS'],prompt:"Holiday pay of a piece-rate worker is at least:",
 choices:["Average daily earnings for the last 7 work days","Minimum wage × 2","Nothing","Last month's average"],ans:[0],why:"Piece-rate: at least equal to the average daily earnings of the past 7 work days."},
q76:{type:'single',pg:['CS'],prompt:"Seasonal workers during the off-season:",
 choices:["Are not paid holiday pay","Get 100% holiday pay","Get 200%","Get 50%"],ans:[0],why:"Seasonal workers aren't paid holiday pay during the off-season."},
m4:{type:'match',pg:[9,17,22,23,'CS'],prompt:"Match the holiday rates",pairs:[["Regular, unworked","100%"],["Regular, worked","200%"],["Regular + rest day","260%"],["Special, worked","130%"],["Special + rest day","150%"]],
 why:"Regular = double. Special = extra 30%. Add a rest day: ×1.3 for regular, 150% for special."},

/* ================= UNIT 5: SHOW ME THE MONEY ================= */
l22:{type:'learn',pg:[9,'CS'],title:"RA 6727: Wage Rationalization Act",say:"Money unit. Wages first.",
 body:"<b>Minimum wage</b>: the lowest legal salary an employer can pay, set by the <b>RTWPBs</b>.<br><b>Basis for wage classification</b> (RA 6727): <b>agriculture, retail establishment, service establishment</b>.<br><b>Regional Wage Orders</b>: prescribe the daily minimum wage, and give the basis and procedure for <b>applying for exemption</b> (at most <b>1 year</b>, e.g., natural calamities).<br>Per notes: NCR = <b>₱658 to ₱695</b>; NCR kasambahays = <b>₱7,000 to ₱7,800</b> (these figures change with new wage orders).<br><b>Workers paid by results</b>: at least the prescribed minimum wage."},
l23:{type:'learn',pg:['CS'],title:"Penalties, BMBEs & More",
 body:"<b>Penalty for violation:</b> fine <b>₱25,000 to ₱100,000</b>, imprisonment <b>2 to 4 years</b>, and pay the employee <b>double the unpaid</b> amount.<br><b>BMBEs</b> (Barangay Micro Business Enterprises): assets <b>not exceeding ₱3M</b>; employees still get <b>SSS and PhilHealth</b>.<br><b>AERW</b> (Art. 124): all private establishments submit an <b>annual verified itemized report</b> of labor component and salaries.<br><b>Income tax:</b> exempt from withholding = <b>minimum wage earners</b> and annual salary <b>≤ ₱250,000</b>.<br><b>EEMR</b> (Estimated Equivalent Monthly Rate) factors: monthly-paid = <b>365</b>; daily-paid with 1 rest day = <b>313</b>, 2 rest days = <b>261</b> (every day = 395 per notes).<br><b>Kasambahay as salesclerk</b> → gets the retail/service wage. Reduced workdays → wages deducted, 'no work, no pay'."},
q77:{type:'single',pg:['CS'],prompt:"RA 6727 is known as the:",
 choices:["Wage Rationalization Act","Kasambahay Law","Expanded Maternity Leave Law","Magna Carta of Women"],ans:[0],why:"RA 6727 = Wage Rationalization Act (minimum wage)."},
q78:{type:'single',pg:['CS'],prompt:"Under RA 6727, wages are classified by:",
 choices:["Agriculture, retail establishment, service establishment","Gender, age, religion","Region only","Educational attainment"],ans:[0],why:"Basis for wage classification: agriculture, retail, service."},
q79:{type:'single',pg:['CS'],prompt:"Penalty for violating minimum wage law:",
 choices:["₱25k to ₱100k fine, 2 to 4 years jail, and pay double the unpaid","₱5,000 fine only","6 months jail only","A warning"],ans:[0],why:"Fine ₱25,000 to ₱100,000, imprisonment 2 to 4 years, and double the unpaid wages to the employee."},
q80:{type:'single',pg:['CS'],prompt:"A BMBE has assets NOT exceeding:",
 choices:["₱3 million","₱1 million","₱10 million","₱500,000"],ans:[0],why:"BMBE assets ≤ ₱3M. Employees still get SSS and PhilHealth."},
q81:{type:'single',pg:['CS'],prompt:"Daily-paid employee with 1 rest day per week. EEMR factor:",
 choices:["313","365","261","395"],ans:[0],why:"Monthly-paid 365. Daily-paid: 1 rest day 313, 2 rest days 261."},
q82:{type:'single',pg:['CS'],prompt:"Who is exempt from withholding tax, per the cheat sheet?",
 choices:["Minimum wage earners and those earning ≤ ₱250,000 a year","All employees","Managers only","OFWs only"],ans:[0],why:"MWEs and annual salary not exceeding ₱250,000."},
q83:{type:'single',pg:['CS'],prompt:"AERW (Art. 124) requires all private establishments to:",
 choices:["Submit an annual verified itemized report of labor component and wages","Post the CBA","Pay 13th month","Register with PESO"],ans:[0],why:"Annual Establishment Report on Wages."},
q84:{type:'single',pg:['CS'],prompt:"A kasambahay is assigned as salesclerk in the employer's store. Her wage should be:",
 choices:["The wage for retail and service","The kasambahay rate","Half the kasambahay rate","No change at all"],ans:[0],why:"Working as salesclerk = wage for retail and service."},

l24:{type:'learn',pg:[10,23],title:"Payment of Wages",
 body:"Wages must be paid <b>at least twice a month</b> (every 2 weeks), with a <b>maximum of 16 days</b> between payments. Employers can't delay salary too long.<br><b>Exception:</b> <b>force majeure</b> (natural disasters): pay immediately after.<br><b>Conditions:</b> must be paid <b>on time</b>, in <b>legal money/cash</b>, and <b>near the workplace</b> (to avoid burdening employees).<br>Memory: <b>'Salary should be easy to claim.'</b>",
 ex:"Factory workers shouldn't have to travel to another city just to get their salary."},
l25:{type:'learn',pg:[18,'CS'],title:"Service Charges",
 body:"<b>Service charges</b> (Art. 96, amended by <b>RA 11360</b>): what customers pay (usually <b>10%</b>) for services in restaurants, hotels, cafes.<br>NOT a statutory contribution to gov't funds; it's a <b>form of indirect compensation</b> in the service industry.<br><b>Who gets it:</b> employees serving customers (waiters, hotel staff), i.e., <b>rank-and-file, not management</b>.<br><b>Distribution:</b> <b>completely and equally</b>, based on actual hours/days of work, <b>not less than once every 2 weeks or twice a month</b> (intervals ≤ 16 days)."},
q85:{type:'single',pg:[10],prompt:"Wages must be paid at least:",
 choices:["Twice a month (every 2 weeks)","Once a month","Every week","Every quarter"],ans:[0],why:"At least every 2 weeks or twice a month."},
q86:{type:'single',pg:[10],prompt:"The maximum interval between paydays:",
 choices:["16 days","15 days","30 days","7 days"],ans:[0],why:"16 days maximum between payments."},
q87:{type:'single',pg:[10],prompt:"When can the regular payday be delayed?",
 choices:["Force majeure like natural disasters (pay immediately after)","When the owner is on vacation","When sales are low","When the employee asks"],ans:[0],why:"Only force majeure, and pay immediately after."},
q88:{type:'single',pg:[23],prompt:"Why must wages be paid near the workplace?",
 choices:["To avoid burdening employees","To save on bank fees","For tax purposes","For DOLE inspections"],ans:[0],why:"'Salary should be easy to claim.'"},
q89:{type:'multi',need:2,pg:[23],prompt:"Which are valid conditions for payment of wages? (Choose 2)",
 choices:["Paid on time","Paid in legal money/cash","Paid in company products","Paid in another city"],ans:[0,1],why:"On time, legal money/cash, near the workplace."},
q90:{type:'single',pg:[18,'CS'],prompt:"Service charges must be distributed:",
 choices:["Completely and equally to covered rank-and-file employees","Mostly to management","Only to the owner","50/50 owner and staff"],ans:[0],why:"RA 11360: 100% to covered employees, equally, based on hours/days worked. Not management."},
q91:{type:'single',pg:['CS'],prompt:"Service charges are distributed at least:",
 choices:["Twice a month (intervals of 16 days max)","Monthly","Yearly","Quarterly"],ans:[0],why:"Not less than once every two weeks or twice a month, intervals not exceeding 16 days."},
q92:{type:'single',pg:[18],prompt:"Service charges are best described as:",
 choices:["Indirect compensation in the service industry","A statutory gov't contribution","A tax","An SSS premium"],ans:[0],why:"Not a statutory contribution; a compensation-related benefit."},

l26:{type:'learn',pg:[11,12],title:"13th Month Pay",
 body:"A <b>mandatory benefit</b>: like a bonus, but <b>REQUIRED by law</b>.<br>= <b>1/12 of total basic salary</b> earned within the year.<br>Given <b>on or before December 24</b>.<br><b>Exempt (per notes):</b> <b>distressed employers</b> (losing substantial money), and non-profit organizations with a <b>40%+ income decline for 2 years</b>."},
l27:{type:'learn',pg:[9,17,'CS'],title:"Service Incentive Leave (SIL)",
 body:"<b>SIL</b> (Art. 95): mandatory <b>5 days leave with pay per year</b> for employees with <b>at least 1 year</b> of service. Use it for vacation, rest, emergencies.<br><b>Unused SIL → converted to cash</b> at year end, based on the salary rate at the date of conversion.<br><b>Not eligible:</b> government, managerial, field personnel, domestic helpers, establishments with <b>less than 10 employees</b> (for SIL this means <b>ANY</b> establishment, not just retail/service), and those <b>already enjoying 5+ days paid vacation leave</b>."},
q93:{type:'single',pg:[11],prompt:"13th month pay equals:",
 choices:["1/12 of total basic salary in the year","One month's gross pay including OT","½ month salary","13 days of salary"],ans:[0],why:"1/12 of total basic salary."},
q94:{type:'single',pg:[11],prompt:"13th month pay must be given:",
 choices:["On or before December 24","By January 15","By December 31","Anytime the employer wants"],ans:[0],why:"Given before December 24."},
q95:{type:'single',pg:[12],prompt:"Which employer is EXEMPT from 13th month pay?",
 choices:["A distressed employer losing substantial money","Any company with under 10 employees","BPO companies","Private schools"],ans:[0],why:"Per notes: distressed employers (and certain non-profits with 40%+ income decline for 2 years)."},
q96:{type:'single',pg:[9],prompt:"The SIL benefit is:",
 choices:["5 days paid leave per year after 1 year of service","7 days after 6 months","10 days after 1 year","3 days per year"],ans:[0],why:"5 days with pay per year, at least 1 year of service."},
q97:{type:'single',pg:[9,'CS'],prompt:"Unused SIL at the end of the year:",
 choices:["Is converted to cash","Is forfeited","Carries over forever","Goes to the union"],ans:[0],why:"Not exhausted → monetary equivalent, at the salary rate on the date of conversion."},
q98:{type:'single',pg:[9,17,'CS'],prompt:"An employee already gets 7 days paid vacation leave. Are they also entitled to SIL?",
 choices:["No, those with 5+ days paid VL are exempt","Yes, 5 more days","Yes, and it doubles to 12","Only as cash"],ans:[0],why:"Those enjoying vacation leave with pay of at least 5 days are exempt from SIL."},
q99:{type:'single',pg:['CS'],prompt:"For SIL, exemption (b) on establishments with less than 10 employees applies to:",
 choices:["Any establishment, not just retail/service","Only retail and service","Only agricultural","No one"],ans:[0],why:"Cheat sheet: (b) in SIL = any establishment, not limited to retail and service."},

l28:{type:'learn',pg:[10,11],title:"Retirement Pay",
 body:"<ul><li><b>Optional:</b> age <b>60+</b> (not beyond 65), at least <b>5 years</b> of service.</li><li><b>Compulsory:</b> age <b>65</b>, same requirements.</li></ul>Benefit: <b>½ month salary per year of service</b>.<br><b>½ month = 22.5 days</b> = 15 days salary + 5 days SIL + 1/12 of 13th month (2.5 days).<br>Formula: <b>daily rate × 22.5 × years</b>.<br><b>Exempt:</b> government (Civil Service), domestic helpers and personal service workers, retail/service/agricultural establishments with <b>10 or fewer</b> employees.<br><b>CBA/contract</b> benefits must <b>not be lower</b> than the Labor Code; if lower (even with employee contributions + interest), the <b>employer pays the difference</b>."},
l29:{type:'learn',pg:[11],title:"Special Retirement Cases",
 body:"<b>Paid by results:</b> based on <b>average daily salary</b> = total salary in the last 12 months ÷ actual days worked.<br><b>Part-time workers:</b> also ½ month per year IF there's no retirement plan, they're at least <b>60</b>, and worked at least <b>5 years</b>.<br><b>Underground/surface miners:</b> optional <b>50 to 60</b>, mandatory <b>60</b>, at least 5 years as a miner.<br><b>Racehorse jockeys:</b> mandatory <b>55</b>, at least 5 years, must have paid <b>additional SSS premium</b>."},
q100:{type:'single',pg:[10],prompt:"Optional retirement age:",
 choices:["60 (but not beyond 65)","55","50","65"],ans:[0],why:"Optional: 60+, not beyond 65."},
q101:{type:'single',pg:[10],prompt:"Compulsory retirement age:",
 choices:["65","60","70","55"],ans:[0],why:"Compulsory retirement is at 65."},
q102:{type:'single',pg:[10],prompt:"Minimum service required for retirement pay:",
 choices:["5 years","1 year","10 years","15 years"],ans:[0],why:"At least 5 years of service."},
q103:{type:'multi',need:3,pg:[10,11],prompt:"The 22.5 days of '½ month salary' is made of: (Choose 3)",
 choices:["15 days salary","5 days SIL","1/12 of 13th month pay (2.5 days)","7 days paternity leave"],ans:[0,1,2],why:"15 + 5 + 2.5 = 22.5 days."},
q104:{type:'single',pg:[11],prompt:"Compulsory retirement age for underground miners:",
 choices:["60","65","55","50"],ans:[0],why:"Miners: optional 50 to 60, mandatory 60."},
q105:{type:'single',pg:[11],prompt:"Mandatory retirement age for racehorse jockeys:",
 choices:["55","60","65","50"],ans:[0],why:"Jockeys: mandatory 55, 5 years, additional SSS premium."},
q106:{type:'single',pg:[11],prompt:"The CBA's retirement benefit is LOWER than what the Labor Code requires. What happens?",
 choices:["The employer pays the difference","The CBA prevails","The employee loses the difference","DOLE pays the gap"],ans:[0],why:"CBA benefits can't be lower; the employer must pay the shortage."},
q107:{type:'single',pg:[10],prompt:"Which employer is EXEMPT from retirement pay?",
 choices:["A retail store with 8 employees","A BPO with 200 employees","A bank","A 50-worker factory"],ans:[0],why:"Retail, service, agricultural establishments with 10 or fewer employees are exempt."},
q108:{type:'single',pg:[11],prompt:"Retirement pay of a worker paid by results is based on:",
 choices:["Average daily salary (last 12 months ÷ actual days worked)","Minimum wage","Their highest single day","The CEO's salary"],ans:[0],why:"Total salary in the last 12 months ÷ actual number of days worked."},

l30:{type:'learn',pg:[12],title:"Separation Pay",
 body:"Money given when terminated due to <b>authorized causes</b>: business-related or uncontrollable, <b>NOT the employee's fault</b>. If the employee did something wrong (misconduct) → <b>no separation pay</b>.<ul><li>Installation of labor-saving devices: <b>1 month/year</b></li><li>Redundancy: <b>1 month/year</b></li><li>Retrenchment (to prevent losses): <b>½ month/year</b></li><li>Closure of business: <b>½ month/year</b></li><li>Disease/illness: <b>½ month/year</b></li></ul>Also: impossible reinstatement (per Supreme Court), and security guards <b>without assignment for 6 months</b> (DOLE rules)."},
q109:{type:'single',pg:[12],prompt:"Separation pay is given when termination is due to:",
 choices:["Authorized causes (not the employee's fault)","Serious misconduct","Voluntary resignation","Willful disobedience"],ans:[0],why:"Authorized causes = business-related. Misconduct = no separation pay."},
q110:{type:'single',pg:[12],prompt:"Which authorized cause gives 1 MONTH per year of service?",
 choices:["Redundancy","Retrenchment","Closure of business","Disease"],ans:[0],why:"1 month: labor-saving devices and redundancy. ½ month: retrenchment, closure, disease."},
q111:{type:'single',pg:[12],prompt:"Retrenchment to prevent losses gives:",
 choices:["½ month per year","1 month per year","Nothing","2 months per year"],ans:[0],why:"Retrenchment = ½ month per year of service."},
q112:{type:'single',pg:[12],prompt:"Security guards may get separation pay if left without assignment for:",
 choices:["6 months","1 month","3 months","12 months"],ans:[0],why:"DOLE rules: security guards without assignment for 6 months."},
m5:{type:'match',pg:[9,10,11,12],prompt:"Match the money",pairs:[["13th month","1/12 of basic salary"],["SIL","5 days paid leave"],["Retirement","½ month per year"],["Redundancy","1 month per year"],["Retrenchment","½ month per year"]],
 why:"Redundancy and labor-saving devices = 1 month. Retrenchment, closure, disease = ½ month."},

/* ================= UNIT 6: LEAVES & BENEFITS ================= */
l31:{type:'learn',pg:[12,13],title:"Maternity Leave (RA 11210)",say:"Leave unit. Lots of numbers here, go slow.",
 body:"<b>RA 11210, Expanded Maternity Leave Law.</b> Maternity benefits for female employees through <b>SSS</b>.<br><b>Requirements:</b> at least <b>3 monthly contributions in the last 12 months</b>, and must <b>notify</b> the employer/SSS of the pregnancy.<br><b>Benefit:</b> based on <b>ADSC</b> (Average Daily Salary Credit).<ul><li><b>105 days</b>: live childbirth (normal or C-section)</li><li><b>120 days</b>: solo parents (Solo Parents' Welfare Act)</li><li><b>60 days</b>: miscarriage or emergency termination</li></ul>"},
l32:{type:'learn',pg:[13],title:"Paternity Leave (RA 8187)",
 body:"For <b>married male employees</b>: <b>7 days leave with full pay</b>.<br>Condition: for the <b>first 4 deliveries</b> of the <b>legitimate spouse</b>.<br>Law: <b>RA 8187</b> (June 11, 1996)."},
q113:{type:'single',pg:[13],prompt:"Maternity leave for live childbirth (normal or C-section):",
 choices:["105 days","60 days","120 days","78 days"],ans:[0],why:"105 days for live childbirth, normal or CS."},
q114:{type:'single',pg:[13],prompt:"Maternity leave for solo parents:",
 choices:["120 days","105 days","150 days","60 days"],ans:[0],why:"120 days under the Solo Parents' Welfare Act."},
q115:{type:'single',pg:[13],prompt:"Leave for miscarriage or emergency termination:",
 choices:["60 days","105 days","30 days","None"],ans:[0],why:"60 days."},
q116:{type:'single',pg:[12,13],prompt:"SSS maternity benefit requires at least:",
 choices:["3 monthly contributions in the last 12 months","12 contributions","6 months of contributions","1 year of service"],ans:[0],why:"At least 3 months paid in the last 12 months, plus notification."},
q117:{type:'single',pg:[13],prompt:"The Expanded Maternity Leave Law is:",
 choices:["RA 11210","RA 8187","RA 9710","RA 10361"],ans:[0],why:"RA 11210."},
q118:{type:'single',pg:[13],prompt:"Paternity leave is:",
 choices:["7 days full pay, married males, first 4 deliveries of legitimate spouse","14 days for any male","7 days, unlimited deliveries","105 days"],ans:[0],why:"RA 8187: 7 days with full pay, first 4 deliveries of the legitimate spouse."},
q119:{type:'single',pg:[13],prompt:"The Paternity Leave Law is:",
 choices:["RA 8187","RA 8972","RA 9262","RA 6727"],ans:[0],why:"RA 8187 (June 11, 1996)."},
q120:{type:'single',pg:[13],prompt:"Maternity benefit amount is based on the:",
 choices:["Average Daily Salary Credit (ADSC)","Husband's salary","Minimum wage","13th month pay"],ans:[0],why:"Benefit amount is based on ADSC."},

l33:{type:'learn',pg:[13,14],title:"Magna Carta of Women (RA 9710)",
 body:"Protects women's rights. Key rights: <b>no discrimination</b>, <b>protection from violence</b>, <b>equal opportunity</b>.<br>Also: security during disasters and calamities, equal participation in government and politics, equal treatment before the law, <b>equal access to education (no expulsion due to pregnancy)</b>, equal participation in sports, non-discrimination in military/police service, comprehensive health services, equal rights in marriage and family relations.<br><b>Special leave:</b> <b>2 months with full pay</b> for <b>gynecological surgery</b>, requires <b>6 months continuous service</b>."},
q121:{type:'single',pg:[13,14],prompt:"Magna Carta special leave for gynecological surgery:",
 choices:["2 months with full pay","10 days","7 days","105 days"],ans:[0],why:"2 months full pay."},
q122:{type:'single',pg:[14],prompt:"Service required to avail of that special leave:",
 choices:["6 months continuous service","1 year","3 months","None"],ans:[0],why:"Requires 6 months continuous service."},
q123:{type:'single',pg:[13],prompt:"The Magna Carta of Women is:",
 choices:["RA 9710","RA 9262","RA 11210","RA 8187"],ans:[0],why:"RA 9710. (RA 9262 is the VAWC law.)"},
q124:{type:'single',pg:[13],prompt:"Which is a right under the Magna Carta of Women?",
 choices:["Equal access to education, no expulsion due to pregnancy","Double 13th month pay","Free housing","Retirement at 50"],ans:[0],why:"Equal access to education is listed in the notes."},

l34:{type:'learn',pg:[18,'CS'],title:"Solo Parent & VAWC Leave",
 body:"<b>Solo parent leave (RA 8972, Solo Parents' Welfare Act):</b> <b>7 days with pay every year</b>. Forfeitable, noncumulative, <b>not convertible to cash</b>. Conditions: rendered <b>at least 6 months</b> of service, notified the employer, presented a <b>solo parent ID</b>.<br>Covers: widowed/separated/abandoned parents, spouse or family member of an OFW, unmarried mother/father, legal guardian, relatives within the 4th civil degree, pregnant woman providing sole care.<br><br><b>VAWC leave (RA 9262):</b> <b>10 days with full pay</b>, extendable when needed. Needs certification from the <b>barangay chairman, counselor, prosecutor, or clerk of court</b>. At the woman's option, every instance, <b>not cumulative</b>, <b>not convertible to cash</b>."},
q125:{type:'single',pg:[18,'CS'],prompt:"Solo parent leave:",
 choices:["7 days with pay per year","10 days","5 days","105 days"],ans:[0],why:"RA 8972: 7 days paid leave every year."},
q126:{type:'single',pg:['CS'],prompt:"Service required for solo parent leave:",
 choices:["At least 6 months","1 year","3 months","5 years"],ans:[0],why:"Rendered at least 6 months, notified employer, solo parent ID."},
q127:{type:'single',pg:['CS'],prompt:"VAWC leave:",
 choices:["10 days with full pay","7 days","2 months","5 days"],ans:[0],why:"RA 9262: 10 days with full pay, extendable when needed."},
q128:{type:'single',pg:['CS'],prompt:"The VAWC leave law is:",
 choices:["RA 9262","RA 9710","RA 8972","RA 10361"],ans:[0],why:"RA 9262 (Anti-Violence Against Women and Their Children)."},
q129:{type:'multi',need:2,pg:['CS'],prompt:"About unused solo parent and VAWC leave, which are TRUE? (Choose 2)",
 choices:["Not convertible to cash","Not cumulative","Converted to cash at year end","Carried over to next year"],ans:[0,1],why:"Both are noncumulative and not convertible to cash. (Unlike SIL, which converts to cash.)"},
q130:{type:'single',pg:['CS'],prompt:"Who can certify a VAWC leave?",
 choices:["Barangay chairman, counselor, prosecutor, or clerk of court","The HR manager","The union president","SSS"],ans:[0],why:"Certification from barangay chairman, counselor, prosecutor, or clerk in court."},

l35:{type:'learn',pg:[14,15],title:"Kasambahay Law (RA 10361)",
 body:"A <b>kasambahay</b> (domestic worker) does domestic work in an <b>employer's household</b>: yaya/nanny, cook, laundry person, housekeeper, gardener, <b>driver for private vehicles</b>.<br><b>Rights:</b> minimum wage (varies by region), max <b>8 hours/day</b> with OT pay if more (per notes), <b>1 day off/week (24 consecutive hours)</b>, <b>13th month after 1 month</b> of service, <b>5-day SIL</b> with pay, employer must <b>enroll in SSS, PhilHealth, Pag-IBIG</b>, contract <b>in writing</b> (English or Filipino).<br><b>Employers CANNOT:</b> withhold wages, confiscate IDs/personal documents, charge placement fees, abuse or mistreat.<br>A kasambahay may <b>resign anytime with 5 days notice</b>."},
q131:{type:'single',pg:[14],prompt:"Which is a kasambahay?",
 choices:["The family's private driver","A company bus driver","A hotel housekeeper","A restaurant cook"],ans:[0],why:"Domestic work in a household, including driver for private vehicles."},
q132:{type:'single',pg:[14],prompt:"A kasambahay is entitled to 13th month pay after:",
 choices:["1 month of service","1 year","6 months","Never"],ans:[0],why:"Entitled after 1 month of service."},
q133:{type:'single',pg:[14],prompt:"A kasambahay's contract must be:",
 choices:["In writing (English or Filipino)","Verbal is enough","Notarized in English only","Not required"],ans:[0],why:"Must be in writing, English or Filipino."},
q134:{type:'single',pg:[14],prompt:"Which CAN the employer of a kasambahay do?",
 choices:["Enroll them in SSS, PhilHealth, Pag-IBIG","Confiscate their IDs","Withhold wages","Charge a placement fee"],ans:[0],why:"Enrolling them is required. The rest are prohibited."},
q135:{type:'single',pg:[15],prompt:"A kasambahay may resign anytime with:",
 choices:["5 days notice","30 days notice","1 day notice","No notice"],ans:[0],why:"5 days notice."},
q136:{type:'single',pg:[14],prompt:"Kasambahay service incentive leave:",
 choices:["5 days annual SIL with pay","7 days","10 days","None"],ans:[0],why:"Batas Kasambahay: 5 days annual SIL with pay."},

l36:{type:'learn',pg:[17,18],title:"SPP: SSS, PhilHealth, Pag-IBIG",
 body:"<b>SPP = 'Sure Pay Provided'</b>.<br><b>SSS</b> (Social Security System): financial protection for <b>sickness, maternity, disability, retirement, death</b>. Covers all private sector employees; voluntary for self-employed/OFWs. Employee and employer each pay a portion, based on <b>monthly salary credit</b>. <b>Mandatory</b>; non-payment violates labor law.<br><b>PhilHealth</b>: <b>health insurance</b> for hospitalization, consultations, some procedures. Covers private and public employees, self-employed, OFWs, retirees. Shared contribution. Exam tip: <b>'your health safety net'</b>.<br><b>Pag-IBIG (HDMF)</b>: <b>housing loans</b>, savings program, emergency loans. All private employees; voluntary for self-employed. Employee pays a monthly %, <b>employer matches</b>."},
q137:{type:'single',pg:[17],prompt:"SSS gives financial protection for:",
 choices:["Sickness, maternity, disability, retirement, death","Housing loans only","Hospital bills only","13th month pay"],ans:[0],why:"SSS: sickness, maternity, disability, retirement, death."},
q138:{type:'single',pg:[17],prompt:"The SSS contribution percentage depends on the:",
 choices:["Monthly salary credit","Employee's age","Region","Union membership"],ans:[0],why:"Based on the monthly salary credit."},
q139:{type:'single',pg:[18],prompt:"'Your health safety net' is:",
 choices:["PhilHealth","SSS","Pag-IBIG","NCMB"],ans:[0],why:"PhilHealth = health insurance."},
q140:{type:'single',pg:[18],prompt:"Housing loans come from:",
 choices:["Pag-IBIG (HDMF)","PhilHealth","SSS","DOLE"],ans:[0],why:"Pag-IBIG: housing loans, savings, emergency loans."},
q141:{type:'single',pg:[17],prompt:"Not paying SSS for a private employee is:",
 choices:["A violation of labor law","OK if the employee agrees","OK for firms under 10 workers","Only required for managers"],ans:[0],why:"SSS is mandatory for all private employees."},
q142:{type:'single',pg:[18],prompt:"For Pag-IBIG contributions:",
 choices:["Employee pays a monthly %, employer matches","Employer pays everything","Employee pays everything","Gov't pays everything"],ans:[0],why:"Employee pays a percentage, employer matches."},
m6:{type:'match',pg:[13,14,18,'CS'],prompt:"Match the leave",pairs:[["Maternity","105 days"],["Paternity","7 days, married male"],["Solo parent","7 days per year"],["VAWC","10 days"],["Magna Carta","2 months, surgery"]],
 why:"Maternity 105 (120 solo, 60 miscarriage). Paternity 7. Solo parent 7. VAWC 10. Magna Carta 2 months."},

/* ================= UNIT 7: HIRED, FIRED, DISPUTED ================= */
l37:{type:'learn',pg:[15],title:"Types of Employment",say:"Last topic unit. Hired, fired, disputed.",
 body:"<ol><li><b>Regular:</b> no fixed end date; full benefits (13th month, holiday pay, leave credits, security of tenure); dismissed only for <b>just or authorized causes</b>.</li><li><b>Probationary:</b> trial period of <b>max 6 months</b>; employer must inform employee of the <b>standards for regularization</b>; not regularized after 6 months → <b>deemed regular</b>.</li><li><b>Project / Fixed-term:</b> for a specific project or period; ends on completion or expiry; <b>no separation pay</b> if it ends naturally.</li><li><b>Seasonal:</b> peak seasons only (Christmas, harvest); same rights as project employees during the period.</li><li><b>Casual:</b> not regular, not project; short-term, non-continuous. If the work becomes <b>necessary and desirable</b> to the business → may become regular.</li></ol>"},
q143:{type:'single',pg:[15],prompt:"Maximum probationary period:",
 choices:["6 months","3 months","1 year","2 years"],ans:[0],why:"Probationary trial period: max 6 months."},
q144:{type:'single',pg:[15],prompt:"A probationary employee keeps working past 6 months without being regularized. They are:",
 choices:["Deemed a regular employee","Still probationary","A casual employee","Automatically terminated"],ans:[0],why:"Not regularized after 6 months → deemed regular."},
q145:{type:'single',pg:[15],prompt:"Ends when the project is done; no separation pay if it ends naturally:",
 choices:["Project / fixed-term","Regular","Probationary","Casual"],ans:[0],why:"Project/fixed-term employment."},
q146:{type:'single',pg:[15],prompt:"Extra helpers hired only for the Christmas rush are:",
 choices:["Seasonal employees","Regular employees","Managerial employees","Field personnel"],ans:[0],why:"Seasonal = peak seasons only (Christmas, harvest)."},
q147:{type:'single',pg:[15],prompt:"A casual employee's work becomes necessary and desirable to the business. They:",
 choices:["May become regular","Must be terminated","Become project employees","Become contractors"],ans:[0],why:"Necessary and desirable work → may become regular."},
q148:{type:'single',pg:[15],prompt:"What must the employer tell a probationary employee?",
 choices:["The standards for regularization","Their retirement date","The CBA posting dates","Their SSS number"],ans:[0],why:"Employer must inform the employee of the standards for regularization."},

l38:{type:'learn',pg:[15,19],title:"Job Contracting vs Labor-Only",
 body:"One of the <b>MOST IMPORTANT</b> CHRA topics.<br><b>Job contracting (LEGAL ✓):</b> company hires a contractor for specific work. The contractor has <b>substantial capital</b>, supplies <b>tools, equipment, materials</b>, is <b>independent</b>, and <b>pays wages and benefits</b> to its workers.<br><b>Labor-only contracting (ILLEGAL ✗):</b> contractor has <b>no capital</b>, <b>only supplies workers</b>, and the <b>principal controls how the work is done</b>. It violates labor laws, and the workers are considered <b>employees of the principal company</b>.<br><b>Legitimate contractor must have:</b> substantial capital, directly-employed workforce, contract-compliant work premises, tools/equipment/machinery, safe working conditions and proper compensation."},
l39:{type:'learn',pg:[15,16],title:"Tests for Employment",
 body:"<b>Four-fold test:</b><ol><li><b>Selection</b>: who chose the worker?</li><li><b>Payment of wages</b>: who pays?</li><li><b>Power of dismissal</b>: who can fire?</li><li><b>Control</b>: who controls HOW the work is done? <b>(Most important!)</b></li></ol><b>Control test:</b> does the employer control HOW work is done?<br><b>Economic dependency test:</b> is the worker dependent on the company for income?<br><b>Independent contractor test:</b> has their own business, substantial capital (tools, equipment), free from the employer's control except for results, follows labor laws for their own employees."},
q149:{type:'single',pg:[19],prompt:"Labor-only contracting in the Philippines is:",
 choices:["Illegal","Legal","Legal with a DOLE permit","Legal only for BPOs"],ans:[0],why:"Labor-only contracting is ILLEGAL in the Philippines."},
q150:{type:'single',pg:[15,19],prompt:"The contractor supplies ONLY workers, has no tools or capital, and the principal controls the work. This is:",
 choices:["Labor-only contracting","Job contracting","A private employment agency","A manning agency"],ans:[0],why:"No capital + only supplies workers + principal controls = labor-only (illegal)."},
q151:{type:'single',pg:[15],prompt:"In labor-only contracting, the workers are considered employees of:",
 choices:["The principal company","The contractor","DOLE","Nobody"],ans:[0],why:"Workers are considered employees of the principal."},
q152:{type:'multi',need:3,pg:[19],prompt:"A legitimate contractor must have: (Choose 3)",
 choices:["Substantial capital","A directly-employed workforce","Tools, equipment, machinery","The principal controlling how the work is done"],ans:[0,1,2],why:"Principal control is a sign of labor-only contracting."},
q153:{type:'single',pg:[15,16],prompt:"The MOST important element of the four-fold test:",
 choices:["Control: who controls HOW the work is done","Selection","Payment of wages","Power of dismissal"],ans:[0],why:"Control is the most important."},
q154:{type:'single',pg:[15,16],prompt:"Which is NOT one of the four-fold test elements?",
 choices:["Economic dependency","Selection","Payment of wages","Power of dismissal"],ans:[0],why:"Economic dependency is a separate test."},
q155:{type:'single',pg:[16],prompt:"'Is the worker dependent on the company for income?' is the:",
 choices:["Economic dependency test","Control test","Four-fold test","I-A-C-M test"],ans:[0],why:"That's the economic dependency test."},
q156:{type:'single',pg:[15,16],prompt:"An independent contractor:",
 choices:["Has their own business and capital, free from control except for results","Is controlled hour by hour","Has no tools","Is a PESO employee"],ans:[0],why:"Own business, substantial capital, free from control except results, follows labor laws for own employees."},

l40:{type:'learn',pg:[11,15],title:"Security of Tenure & Causes",
 body:"<b>Security of tenure (Art. 294):</b> every employee has the right <b>not to be dismissed without a valid reason</b> (just or authorized cause) <b>and proper due process</b>.<br>In <b>illegal dismissal</b> cases, the <b>employer must prove</b> the dismissal was valid. If the dismissal itself is <b>denied</b>, the <b>employee must first prove</b> they were actually dismissed.<br><b>Just causes</b> (employee's fault): serious misconduct, willful disobedience, gross negligence, etc.<br><b>Authorized causes</b> (business reasons): redundancy, retrenchment, closure."},
l41:{type:'learn',pg:[23,25],title:"Serious Misconduct & Due Process",
 body:"<b>Serious misconduct:</b> serious improper behavior related to work; a ground for dismissal.<br><b>Elements:</b> 1. <b>Serious</b> (grave offense) 2. <b>Related to work</b> (connected to duties) 3. <b>Employee becomes unfit</b> (employer loses trust/confidence).<br>Memory: <b>'Serious + Work-related + Unfit'</b>.<br><br><b>Due process</b>, the <b>two-notice rule</b>: 1. <b>Notice to explain</b> 2. <b>Notice of decision</b>. Plus an <b>opportunity to be heard</b>.",
 ex:"An employee punches a supervisor during work → serious misconduct."},
q157:{type:'single',pg:[11],prompt:"Security of tenure is found in Labor Code:",
 choices:["Art. 294","Art. 6","Art. 86","Art. 124"],ans:[0],why:"Art. 294. (Art. 6 = coverage, Art. 86 = NSD, Art. 124 = AERW.)"},
q158:{type:'single',pg:[11],prompt:"In an illegal dismissal case, who must prove the dismissal was valid?",
 choices:["The employer","The employee","DOLE","The union"],ans:[0],why:"The employer must prove the dismissal is valid."},
q159:{type:'single',pg:[11],prompt:"The employer DENIES dismissing anyone. The employee must first prove that:",
 choices:["They were actually dismissed","They are a union member","They received 13th month","They are over 18"],ans:[0],why:"If dismissal is denied, the employee must first prove they were dismissed."},
q160:{type:'single',pg:[15],prompt:"Which is a JUST cause for termination?",
 choices:["Willful disobedience","Redundancy","Retrenchment","Closure of business"],ans:[0],why:"Just causes are the employee's fault. The rest are authorized causes."},
q161:{type:'single',pg:[15],prompt:"Which is an AUTHORIZED cause?",
 choices:["Redundancy","Serious misconduct","Gross negligence","Willful disobedience"],ans:[0],why:"Authorized = business reasons: redundancy, retrenchment, closure."},
q162:{type:'single',pg:[23],prompt:"The 3 elements of serious misconduct:",
 choices:["Serious, related to work, employee becomes unfit","Minor, personal, still fit","Late twice, absent once, warned","Off-duty, unrelated, private"],ans:[0],why:"'Serious + Work-related + Unfit.'"},
q163:{type:'single',pg:[23],prompt:"An employee punches a supervisor during work. This is:",
 choices:["Serious misconduct","An authorized cause","Redundancy","Constructive dismissal"],ans:[0],why:"The notes' real-life example of serious misconduct."},
q164:{type:'single',pg:[25],prompt:"Due process in dismissal, in order:",
 choices:["Notice to explain → Opportunity to be heard → Notice of decision","Notice of decision → Notice to explain → Hearing","Hearing → Notice of decision → Notice to explain","Notice of decision only"],ans:[0],why:"Two-notice rule: explain first, decision last, with a chance to be heard in between."},

l42:{type:'learn',pg:[24,25],title:"The Labor Arbiter",
 body:"A <b>Labor Arbiter</b> is a <b>quasi-judicial officer under the NLRC</b> who hears and decides labor disputes (illegal dismissal, money claims). Created under the <b>Labor Code (P.D. 442)</b>, administered under the <b>NLRC Rules of Procedure</b>. Think: the <b>'trial judge'</b> of labor cases.<br>Has <b>original and exclusive jurisdiction</b>: the <b>FIRST</b> authority that hears the case.<br><b>Cases handled:</b> A. <b>Illegal dismissal</b> (no just/authorized cause, no due process) B. <b>Money claims</b> (unpaid salaries, OT, holiday pay, separation pay, benefits) C. <b>Constructive dismissal</b> (forced to resign due to unbearable conditions) D. <b>Suspension/disciplinary disputes</b> when contested as illegal E. <b>Other</b>: employer-employee relationship issues, damages."},
l43:{type:'learn',pg:[25],title:"What LAs Don't Handle & Appeals",
 body:"<b>Labor Arbiters do NOT handle:</b> criminal cases (regular courts), pure civil disputes with no employer-employee relation, internal policy issues with no labor claim, cases under a voluntary arbitration agreement.<br><b>Path:</b> complaint → <b>Labor Arbiter</b> (NLRC Regional Arbitration Branch) → <b>NLRC Commission Proper</b> (appeal) → <b>Court of Appeals</b> → <b>Supreme Court</b>.<br><b>Role in HR:</b> LAs are the legal dispute stage. HR must ensure <b>due process</b> in termination, <b>proper documentation</b>, and <b>Labor Code standards</b>. HR mistakes often end up as Labor Arbiter cases."},
q165:{type:'single',pg:[24],prompt:"A Labor Arbiter is a:",
 choices:["Quasi-judicial officer under the NLRC","DOLE Secretary","Union leader","Supreme Court justice"],ans:[0],why:"Quasi-judicial officer under the NLRC."},
q166:{type:'single',pg:[24],prompt:"Think of the Labor Arbiter as the ___ of labor cases.",
 choices:["Trial judge","Final appeal court","Mediator","Prosecutor"],ans:[0],why:"'Trial judge': the FIRST authority that hears the case."},
q167:{type:'single',pg:[24],prompt:"An employee is forced to resign due to unbearable working conditions. This is:",
 choices:["Constructive dismissal","Redundancy","Voluntary resignation","Retrenchment"],ans:[0],why:"Constructive dismissal, which the Labor Arbiter handles."},
q168:{type:'multi',need:2,pg:[24],prompt:"Which are money claims a Labor Arbiter handles? (Choose 2)",
 choices:["Unpaid salaries","Overtime pay","A criminal theft case","A pure civil loan with no employment"],ans:[0,1],why:"Money claims: unpaid salaries, OT, holiday pay, separation pay, benefits."},
q169:{type:'single',pg:[25],prompt:"Which case does a Labor Arbiter NOT handle?",
 choices:["Criminal cases","Illegal dismissal","Money claims","Constructive dismissal"],ans:[0],why:"Criminal cases go to regular courts."},
q170:{type:'single',pg:[25],prompt:"The correct appeal path:",
 choices:["Labor Arbiter → NLRC Commission Proper → Court of Appeals → Supreme Court","Labor Arbiter → Supreme Court","NLRC → Labor Arbiter → CA","DOLE → Labor Arbiter → SC"],ans:[0],why:"LA → NLRC (appeal) → CA → SC."},
q171:{type:'single',pg:[24],prompt:"The Labor Arbiter has what kind of jurisdiction over certain labor cases?",
 choices:["Original and exclusive","Appellate only","Advisory only","Criminal"],ans:[0],why:"Original and exclusive: they're the first to hear the case."},

l44:{type:'learn',pg:[19,20],title:"Risk Management",
 body:"<b>Risk management</b>: identifying, analyzing, and controlling risks that may negatively affect an organization. In HR: preventing problems related to employees, legal issues, and workplace operations.<br><b>Purpose:</b> prevent losses (financial, legal, reputation), ensure compliance, protect employees and the organization, maintain smooth operations. In short: <b>'Avoid problems before they happen.'</b><br><b>Importance:</b> 1. Legal protection (avoid lawsuits) 2. Employee safety 3. Financial stability 4. Reputation protection 5. Better decision-making."},
l45:{type:'learn',pg:[20,21],title:"Types of HR Risk & I-A-C-M",
 body:"<ol><li><b>Compliance:</b> not following laws (no 13th month, no SSS/PhilHealth)</li><li><b>Operational:</b> problems in daily HR processes (poor hiring, wrong placement)</li><li><b>Health & Safety:</b> physical danger (unsafe conditions, no safety equipment)</li><li><b>Reputational:</b> damage to company image (harassment going viral, complaints online)</li><li><b>Financial:</b> loss of money (penalties, high turnover cost)</li><li><b>Strategic:</b> poor long-term decisions (unqualified leaders, no workforce planning)</li></ol><b>Process 'I-A-C-M':</b> <b>Identify</b> ('Ano ang possible problem?') → <b>Assess</b> ('Gaano kalaki ang impact?') → <b>Control/Mitigate</b> ('Paano iiwasan or babawasan?') → <b>Monitor</b> ('Effective ba ang solution?')",
 ex:"The company doesn't clearly state termination rules → risk: an employee files an illegal dismissal case."},
q172:{type:'single',pg:[19],prompt:"Risk management, in short:",
 choices:["Avoid problems before they happen","Fix problems after lawsuits","Ignore small problems","Transfer risk to employees"],ans:[0],why:"'Avoid problems before they happen.'"},
q173:{type:'single',pg:[20],prompt:"Not paying 13th month or SSS contributions is what kind of risk?",
 choices:["Compliance risk","Strategic risk","Reputational risk","Health & safety risk"],ans:[0],why:"Not following laws = compliance risk."},
q174:{type:'single',pg:[20],prompt:"A harassment issue goes viral online. What kind of risk?",
 choices:["Reputational","Operational","Compliance","Strategic"],ans:[0],why:"Damage to company image = reputational."},
q175:{type:'single',pg:[20],prompt:"Hiring unqualified leaders and lacking workforce planning:",
 choices:["Strategic risk","Operational risk","Financial risk","Health & safety risk"],ans:[0],why:"Poor long-term decisions = strategic."},
q176:{type:'single',pg:[20],prompt:"Poor hiring decisions and wrong employee placement:",
 choices:["Operational risk","Strategic risk","Reputational risk","Financial risk"],ans:[0],why:"Problems in daily HR processes = operational."},
q177:{type:'single',pg:[20,21],prompt:"Put the risk management process in order:",
 choices:["Identify → Assess → Control/Mitigate → Monitor","Assess → Identify → Monitor → Control","Control → Identify → Assess → Monitor","Monitor → Assess → Identify → Control"],ans:[0],why:"I-A-C-M."},
q178:{type:'single',pg:[21],prompt:"'Effective ba ang solution?' is which step?",
 choices:["Monitor","Identify","Assess","Control/Mitigate"],ans:[0],why:"Step 4: Monitor."},
q179:{type:'single',pg:[20],prompt:"Paying penalties for labor violations and high turnover cost:",
 choices:["Financial risk","Strategic risk","Operational risk","Reputational risk"],ans:[0],why:"Loss of money = financial risk."},
q180:{type:'single',pg:[21],prompt:"A company has no clear termination rules. The main risk:",
 choices:["An employee files an illegal dismissal case","Higher electricity bills","Better reputation","Too many applicants"],ans:[0],why:"The notes' real-life HR example."},

l46:{type:'learn',pg:[26],title:"Cascading Goals",
 body:"<b>Cascading</b>: translating and aligning <b>organizational goals</b> into goals for <b>departments, teams, and individual employees</b>.<br>Company Goal → Department Goal → Team Goal → Individual Goal. Like a <b>waterfall</b>: ORGANIZATION → DEPARTMENT → TEAM → EMPLOYEE.<br><b>Purpose:</b> make sure employees at all levels work toward the <b>same organizational objectives</b>.<br><b>Helps:</b> align individual with org goals, clarify expectations, connect department/team objectives to strategy, improve coordination and accountability.<br><b>CASCADING = TOP → DOWN</b>."},
q181:{type:'single',pg:[26],prompt:"Cascading is:",
 choices:["Translating organizational goals into department, team, and individual goals","Employees setting company goals","Promoting from within","Firing from the bottom up"],ans:[0],why:"Organizational goals flow downward."},
q182:{type:'single',pg:[26],prompt:"Cascading flows:",
 choices:["Top → Down","Bottom → Up","Sideways","Randomly"],ans:[0],why:"CASCADING = TOP → DOWN."},
q183:{type:'single',pg:[26],prompt:"Correct cascading order:",
 choices:["Organization → Department → Team → Employee","Employee → Team → Department → Organization","Team → Organization → Employee → Department","Department → Employee → Organization → Team"],ans:[0],why:"Like a waterfall from the organization down to each employee."},
q184:{type:'single',pg:[26],prompt:"The main purpose of cascading:",
 choices:["Everyone works toward the same organizational objectives","Cut salaries","Increase overtime","Replace HR"],ans:[0],why:"Alignment across all levels."},
m7:{type:'match',pg:[15,19,24,25,26],prompt:"Tap the matching pairs",pairs:[["Labor-only contracting","Illegal"],["Four-fold test","Control is key"],["Labor Arbiter","Trial judge"],["Two-notice rule","Explain, then decide"],["Cascading","Top to down"]],
 why:"The unit in five pairs."},

l47:{type:'learn',pg:[7,11,22,23,'CS'],title:"Formula Cheat Sheet",say:"Hard mode. Grab a calculator.",
 body:"<b>Hourly rate</b> = daily rate ÷ 8.<br><b>Regular holiday:</b> ×1.0 unworked · ×2.0 worked · ×2.6 on rest day · double: ×3.0 worked, ×3.9 on rest day.<br><b>Special day:</b> ×1.3 worked · ×1.5 on rest day · double special on rest day ×1.95.<br><b>Rest day (ordinary):</b> ×1.3.<br><b>OT:</b> ordinary day hourly × 1.25 · premium day: hourly × day rate × 1.3.<br><b>NSD:</b> hours × hourly × 1.10 (the extra alone = hours × hourly × 0.10).<br><b>Retirement:</b> daily × 22.5 × years. <b>13th month:</b> total basic ÷ 12. <b>EEMR:</b> daily × factor ÷ 12."},
h1:{type:'single',pg:[22],prompt:"Daily rate ₱500. Regular holiday, employee absent but qualified. Pay for the day?",
 choices:["₱500","₱0","₱650","₱1,000"],ans:[0],why:"Unworked regular holiday = 100% → ₱500."},
h2:{type:'single',pg:[22],prompt:"Daily rate ₱500. Employee WORKED on a regular holiday. Pay?",

h3:{type:'single',pg:[22],prompt:"Daily rate ₱500. Worked on a regular holiday that's also the rest day. Pay?",
 choices:["₱1,300","₱1,000","₱1,500","₱1,950"],ans:[0],why:"500 × 2.6 = ₱1,300."},
h4:{type:'single',pg:[22,23],prompt:"Daily rate ₱500. Worked on a special non-working day. Pay?",

 choices:["₱900","₱780","₱1,560","₱600"],ans:[0],why:"600 × 1.5 = ₱900."},
h6:{type:'single',pg:['CS'],prompt:"Daily rate ₱600. Worked on a double regular holiday. Pay?",

h7:{type:'single',pg:['CS'],prompt:"Daily rate ₱600. Worked on a double regular holiday that's also the rest day. Pay?",

h9:{type:'single',pg:['CS'],prompt:"Daily rate ₱500. Worked on a double special day that's also the rest day. Pay?",

h10:{type:'multi',need:2,pg:[22,'CS'],prompt:"Daily rate ₱500. Which situations pay exactly ₱1,000? (Choose 2)",

h11:{type:'single',pg:[7,'CS'],prompt:"Daily rate ₱640 (hourly ₱80). 2 hours OT on an ordinary day. OT pay?",

h12:{type:'single',pg:['CS'],prompt:"Hourly ₱80. 2 hours OT on a rest day. OT pay?",

h15:{type:'single',pg:['CS'],prompt:"Hourly ₱80. 2 hours OT on a special day that's also the rest day. OT pay?",

h16:{type:'single',pg:[7,'CS'],prompt:"Hourly ₱80. Worked 10 PM to 2 AM on an ordinary day. Pay for those 4 hours including NSD?",

h21:{type:'single',pg:[11],prompt:"Worker paid by results earned ₱180,000 in the last 12 months over 300 days worked. Average daily salary for retirement?",

h24:{type:'single',pg:['CS'],prompt:"Daily rate ₱600, daily-paid with 1 rest day a week. EEMR (monthly equivalent)?",

h26:{type:'single',pg:[12],prompt:"Same employee (₱20,000/month, 5 years), but terminated due to RETRENCHMENT. Separation pay?",

h28:{type:'single',pg:[18,'CS'],prompt:"A restaurant collected ₱60,000 in service charges. 12 covered employees worked the same hours. Each gets?",

let AC=null;
function tone(seq){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime;
    seq.forEach(([f,d,type='sine',v=.15])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.7;
    });
  }catch(e){}
}

const CODE_PREFIX='QQ1.';
function progressCode(){
  const data={v:1,k:KEY,s:{xp:S.xp,streak:S.streak,lastDay:S.lastDay,done:S.done,mistakes:S.mistakes,bestBoss:S.bestBoss}};
  return CODE_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function readCode(txt){
  const t=(txt||'').replace(/\s+/g,'');
  if(!t) throw new Error('Paste a progress code first.');
  if(!t.startsWith(CODE_PREFIX)) throw new Error("That doesn't look like a progress code.");
  let o; try{o=JSON.parse(decodeURIComponent(escape(atob(t.slice(CODE_PREFIX.length)))))}catch(e){throw new Error('This code is incomplete or damaged. Copy the whole thing again.')}
  if(!o||o.k!==KEY||!o.s) throw new Error('This code is from a different reviewer.');
  const s=o.s, ids=new Set(ALL_LESSONS.map(l=>l.id)), done={};
  Object.entries(s.done||{}).forEach(([k,v])=>{if(ids.has(k)&&typeof v==='number')done[k]=Math.max(0,Math.min(100,v))});
  return {xp:Math.max(0,+s.xp||0),streak:Math.max(0,+s.streak||0),lastDay:typeof s.lastDay==='string'?s.lastDay:null,done,
    mistakes:(Array.isArray(s.mistakes)?s.mistakes:[]).filter(id=>ITEMS[id]&&ITEMS[id].type!=='learn'),
    bestBoss:(s.bestBoss==null?null:Math.max(0,+s.bestBoss||0))};
}
