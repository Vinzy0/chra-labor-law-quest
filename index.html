<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58CC02; --green-d:#58A700; --green-l:#D7FFB8; --green-b:#A5ED6E; --lime:#89E219;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-l:#DDF4FF; --blue-b:#84D8FF;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-l:#FFDFE0; --red-b:#FFB2B2;
  --gold:#FFC800; --gold-d:#E5A500; --orange:#FF9600; --orange-d:#CD7900;
  --purple:#CE82FF; --purple-d:#A568CC;
  --ink:#4B4B4B; --muted:#777777; --faint:#AFAFAF; --line:#E5E5E5; --snow:#F7F7F7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#fff;font-weight:700;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:16px;
  font-weight:800;font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--green);
  box-shadow:0 4px 0 var(--green-d);transition:filter .1s,transform .05s,box-shadow .05s;user-select:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost.gray{color:var(--muted)}
.btn:disabled{background:var(--line);color:var(--faint);box-shadow:none;cursor:default;filter:none;transform:none}
.btn.wide{width:100%}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line)}
.topbar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.course-chip{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--ink);font-size:15px}
.course-chip .flag{width:34px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900;box-shadow:0 3px 0 var(--purple-d)}
.stats{display:flex;align-items:center;gap:14px}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:16px}
.stat svg{width:24px;height:24px}
.stat.fire{color:var(--orange)} .stat.gem{color:var(--blue)} .stat.heart{color:var(--red)}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--faint)}
.icon-btn:hover{background:var(--snow)}
.icon-btn svg{width:22px;height:22px}

/* ---------- Home ---------- */
#home{max-width:620px;margin:0 auto;padding:18px 16px 120px}
.hero{border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:22px}
.hero .mascot-wrap{width:84px;flex:0 0 84px}
.hero h1{font-size:20px;font-weight:900;line-height:1.2}
.hero p{color:var(--muted);font-size:14px;margin-top:4px;font-weight:700}
.hero .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
.pill.gold{background:#FFF4CC;color:#B07D00}
.pill.red{background:var(--red-l);color:var(--red-d)}
.pill.green{background:var(--green-l);color:var(--green-d)}
.pill.blue{background:var(--blue-l);color:var(--blue-d)}

.unit{margin-bottom:26px}
.unit-banner{border-radius:16px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit-banner .u-label{font-size:13px;font-weight:900;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
.unit-banner .u-title{font-size:20px;font-weight:900;line-height:1.2;margin-top:2px}
.guide-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:14px;border:2px solid rgba(0,0,0,.15);
  box-shadow:0 3px 0 rgba(0,0,0,.18);color:#fff;font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.08)}
.guide-btn:active{transform:translateY(3px);box-shadow:none}
.guide-btn svg{width:20px;height:20px}

.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:28px 0 6px;gap:22px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;z-index:1}
.node-wrap.open{z-index:15}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .05s}
.node svg{width:36px;height:36px}
.node:active{transform:translateY(6px)}
.node.done{background:var(--gold)!important;box-shadow:0 7px 0 var(--gold-d)!important}
.node .ring{position:absolute;inset:-9px;border-radius:50%;border:6px solid var(--line)}
.node.done .ring{border-color:#FFE27A}
.node-label{margin-top:12px;font-size:13px;font-weight:800;color:var(--muted);text-align:center;max-width:150px;line-height:1.2}
.start-bubble{position:absolute;top:-46px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;letter-spacing:.6px;
  text-transform:uppercase;animation:bob 1.2s ease-in-out infinite;white-space:nowrap;z-index:2}
.start-bubble::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.popover{position:absolute;top:calc(100% + 10px);z-index:15;width:270px;border-radius:16px;padding:16px;color:#fff;animation:pop .15s ease-out}
.popover::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:inherit}
.popover h3{font-size:17px;font-weight:900;margin-bottom:4px}
.popover p{font-size:14px;font-weight:700;opacity:.9;margin-bottom:12px}
.popover .btn{width:100%;background:#fff;color:inherit;box-shadow:0 4px 0 rgba(0,0,0,.18)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

.boss{margin-top:8px;border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;align-items:center;gap:16px}
.boss .trophy{width:64px;height:64px;flex:0 0 64px;border-radius:18px;background:var(--gold);box-shadow:0 5px 0 var(--gold-d);display:grid;place-items:center}
.boss .trophy svg{width:36px;height:36px}
.boss h3{font-size:18px;font-weight:900}
.boss p{font-size:14px;color:var(--muted);margin:2px 0 10px}

.fab-mistakes{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:25;max-width:588px;width:calc(100% - 32px)}

/* ---------- Lesson ---------- */
#lesson{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column}
.l-head{max-width:1000px;width:100%;margin:0 auto;display:flex;align-items:center;gap:16px;padding:20px 16px 10px}
.l-head .x{color:var(--faint);width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.l-head .x:hover{background:var(--snow)}
.l-head .x svg{width:22px;height:22px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.6,1);position:relative;min-width:16px}
.bar-fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.3)}
.l-hearts{display:flex;align-items:center;gap:5px;color:var(--red);font-weight:900;font-size:17px}
.l-hearts svg{width:26px;height:26px}
.l-hearts.inf{color:var(--blue)}
.l-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.l-inner{max-width:600px;margin:0 auto}
.combo{height:24px;color:var(--orange);font-weight:900;font-size:14px;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.combo svg{width:20px;height:20px}
.combo.pop{animation:pop .25s ease-out}
.q-tag{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-type{font-size:13px;font-weight:900;color:var(--purple-d);letter-spacing:.6px;text-transform:uppercase}
.q-title{font-size:24px;font-weight:900;line-height:1.25;margin-bottom:18px}
.speaker{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px}
.speaker .mascot-wrap{width:92px;flex:0 0 92px}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.45;font-weight:700;color:var(--ink);margin-bottom:22px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;line-height:1.35;background:#fff;transition:background .1s}
.choice:hover:not(:disabled){background:var(--snow)}
.choice:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.choice .key{flex:0 0 30px;height:30px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--faint)}
.choice.multi .key{border-radius:8px}
.choice.sel{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue-d)}
.choice.sel .key{border-color:var(--blue-b);color:var(--blue-d)}
.choice.right{background:var(--green-l);border-color:var(--green-b);color:var(--green-d)}
.choice.right .key{border-color:var(--green-b);color:var(--green-d)}
.choice.wrong{background:var(--red-l);border-color:var(--red-b);color:var(--red-d)}
.choice.wrong .key{border-color:var(--red-b);color:var(--red-d)}
.choice.shake{animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.sum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:.9;margin:0 2px;font-size:1.25em}
.sum .lim{font-size:.5em;font-weight:800}
.fx{font-family:'Cambria Math','Times New Roman',serif;font-style:italic;font-weight:600;font-size:18px}
.fx sub,.fx sup{font-size:.65em}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{min-height:64px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;font-size:15px;font-weight:800;text-align:center;background:#fff;line-height:1.25;display:flex;align-items:center;justify-content:center}
.tile:hover:not(:disabled){background:var(--snow)}
.tile.sel{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue-d)}
.tile.ok{background:var(--green-l);border-color:var(--green-b);color:var(--green-d)}
.tile.bad{background:var(--red-l);border-color:var(--red-b);color:var(--red-d);animation:shake .35s}
.tile.gone{background:#fff;border-color:var(--line);color:#D6D6D6;cursor:default}
.tile.term{font-weight:900;font-size:16px}

/* learn card */
.learn{border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:18px;margin-bottom:8px}
.learn h2{font-size:22px;font-weight:900;margin-bottom:8px;line-height:1.25}
.learn .body{font-size:16px;line-height:1.55;font-weight:700}
.learn .body b{color:var(--blue-d)}
.learn .body ul,.learn .body ol{margin:8px 0 0 22px}
.learn .ex{margin-top:12px;background:var(--blue-l);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;color:var(--blue-d)}
.learn .ex::before{content:"Example";display:block;font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}

/* footer */
.l-foot{border-top:2px solid var(--line);background:#fff;transition:background .15s}
.l-foot.ok{background:var(--green-l);border-color:transparent}
.l-foot.no{background:var(--red-l);border-color:transparent}
.foot-in{max-width:1000px;margin:0 auto;padding:18px 16px 22px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.fb{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:0;max-height:42vh;overflow-y:auto}
.fb-icon{flex:0 0 64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center}
.fb-icon svg{width:34px;height:34px}
.fb h3{font-size:22px;font-weight:900}
.l-foot.ok .fb h3{color:var(--green-d)} .l-foot.no .fb h3{color:var(--red-d)}
.fb .ans{font-size:15px;font-weight:800;margin-top:4px}
.l-foot.ok .fb .ans{color:var(--green-d)} .l-foot.no .fb .ans{color:var(--red-d)}
.fb .why{font-size:15px;font-weight:700;line-height:1.45;margin-top:6px}
.l-foot.ok .fb .why{color:#3E7D00} .l-foot.no .fb .why{color:#B3261E}
.foot-in .btn{min-width:160px}
.l-foot.no .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
@media (max-width:640px){
  .foot-in{flex-direction:column;align-items:stretch}
  .foot-in .btn{width:100%}
  .fb-icon{display:none}
  .q-title{font-size:21px}
  .bubble{font-size:16px}
  .speaker .mascot-wrap{width:70px;flex-basis:70px}
}

/* ---------- Overlays ---------- */
.screen{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
.screen .mascot-wrap{width:150px;margin-bottom:12px}
.screen h2{font-size:30px;font-weight:900;color:var(--gold-d);margin-bottom:6px}
.screen h2.red{color:var(--red)}
.screen .sub{color:var(--muted);font-size:17px;margin-bottom:24px;max-width:420px}
.cards{display:flex;gap:12px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
.scard{width:130px;border-radius:16px;border:2px solid;overflow:hidden}
.scard .t{font-size:12px;font-weight:900;color:#fff;padding:5px 0;letter-spacing:.6px;text-transform:uppercase}
.scard .v{background:#fff;margin:0 2px 2px;border-radius:0 0 13px 13px;padding:12px 0;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.scard .v svg{width:22px;height:22px}
.scard.gold{border-color:var(--gold);background:var(--gold)} .scard.gold .v{color:var(--gold-d)}
.scard.green{border-color:var(--green);background:var(--green)} .scard.green .v{color:var(--green-d)}
.scard.blue{border-color:var(--blue);background:var(--blue)} .scard.blue .v{color:var(--blue-d)}
.scard.orange{border-color:var(--orange);background:var(--orange)} .scard.orange .v{color:var(--orange)}
.screen .actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.review-list{max-width:520px;width:100%;text-align:left;margin:-10px 0 24px;max-height:30vh;overflow-y:auto;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.review-list .ri{padding:8px 0;border-bottom:2px solid var(--snow);font-size:14px;line-height:1.35}
.review-list .ri:last-child{border:none}
.review-list .ri b{color:var(--red-d)}
.review-list .ri span{color:var(--green-d)}

.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:700px){.modal-bg{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 26px;max-height:86vh;overflow-y:auto;animation:up .2s ease-out}
@media (min-width:700px){.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(40px)}to{transform:translateY(0)}}
.modal h2{font-size:22px;font-weight:900;margin-bottom:4px}
.modal .msub{color:var(--muted);font-size:14px;margin-bottom:16px}
.gb-item{display:flex;gap:12px;padding:12px 0;border-bottom:2px solid var(--snow);align-items:flex-start}
.gb-item:last-of-type{border:none}
.gb-term{flex:0 0 120px;font-weight:900;font-size:15px}
.gb-def{font-size:15px;color:var(--ink);font-weight:700;line-height:1.4}
.tip{margin-top:12px;background:#FFF4CC;border-radius:14px;padding:12px 14px;font-size:14px;color:#8A6300;line-height:1.45}
.tip b{color:#6B4C00}
.modal .btn{margin-top:18px}

/* page refs + coverage */
.pill.purple{background:#F3E5FF;color:#8B4FB8}
.pill-btn{cursor:pointer;border:none;font-family:inherit}
.pill-btn:active{transform:translateY(2px)}
.pgref{display:inline-block;margin-top:8px;font-size:13px;font-weight:900;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.75)}
.cov-sum{background:var(--green-l);color:var(--green-d);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:800;line-height:1.4}
.cov-item{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.cov-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cov-pg{font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px}
.cov-pg .ok{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:0 0 22px}
.cov-pg .ok svg{width:14px;height:14px}
.cov-pg .bad{width:22px;height:22px;border-radius:50%;background:var(--red);flex:0 0 22px}
.cov-cnt{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:right}
.cov-topics{font-size:14px;color:var(--ink);margin-top:6px;line-height:1.4;font-weight:700}
.cov-lessons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cov-lessons span{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--snow);color:var(--muted)}
.cov-go{margin-top:10px;height:40px;font-size:13px;width:100%}
.boss .brow{display:flex;gap:10px;flex-wrap:wrap}
.tr-label{font-size:14px;font-weight:900;margin:16px 0 8px}
.code-box{width:100%;min-height:84px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:700 13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--snow);resize:vertical;word-break:break-all}
.code-box:focus{outline:none;border-color:var(--blue-b);background:#fff}
.tr-row{display:flex;gap:10px;margin-top:10px}.tr-row .btn{flex:1}
.tr-msg{min-height:20px;margin-top:10px;font-size:14px;font-weight:800;line-height:1.4}
.tr-msg.ok{color:var(--green-d)}.tr-msg.err{color:var(--red-d)}
.tr-confirm{margin-top:12px;border:2px solid var(--gold);background:#FFF4CC;border-radius:16px;padding:14px;font-size:14px;line-height:1.5;color:#6B4C00}
.tr-confirm b{color:#4B3500}

/* mascot moods */
.mascot .m-happy,.mascot .m-sad{display:none}
.mascot.happy .m-norm,.mascot.sad .m-norm{display:none}
.mascot.happy .m-happy{display:block}
.mascot.sad .m-sad{display:block}
.mascot.happy{animation:hop .45s ease-out}
.mascot.sad{animation:shake .4s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.mascot.idle{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,0.98)}}
</style>
</head>
<body>

l1:{type:'learn',pg:[1],title:"DOLE & NWPC",say:"New unit! Meet the big agencies first.",

l3:{type:'learn',pg:[4,5],title:"Not Covered by the Labor Code (Art. 6)",

l4:{type:'learn',pg:[5],title:"GOCCs, Officers & Public Jobs",

l5:{type:'learn',pg:[5,6],title:"Types of Agencies",
 body:"<b>Private Recruitment Agency (PRA)</b>: a <b>licensed private company</b> that recruits workers for employers, for <b>local or overseas jobs (OFWs)</b>. Must be licensed/registered with <b>DOLE/DMW</b>.<br><b>Private Employment Agency (PEA)</b>: same idea, but focuses on <b>matching local job seekers to local companies</b> (term used in CHRA materials).<br><b>Manning Agency</b>: special recruitment agency for <b>seafarers</b> (ships and marine jobs).<br><b>PESO</b> (Public Employment Service Office): a <b>government office</b>, not private. Helps people find jobs <b>for free</b>. Found in LGUs, schools, and government centers.",

l6:{type:'learn',pg:[21,22],title:"Who Pays the Agency?",

/* ================= UNIT 2: UNION LIFE ================= */
l7:{type:'learn',pg:[1,4],title:"Labor Relations & Unions",say:"Union time. Let's form the team.",
 body:"<b>Labor relations</b>: a field of HRM that focuses on the <b>relationship between employers (management) and employees</b>, especially when employees are represented by a <b>union</b>.<br><b>Unionization</b>: employees <b>form or join a labor union</b> to have a collective voice in dealing with management.<br>A <b>labor union</b> is an organization of workers formed to <b>protect and promote their rights and interests</b>.<br>Employees unionize to: negotiate <b>better wages</b>, improve <b>working conditions</b>, secure <b>benefits</b>, protect their <b>rights</b>, and be represented in <b>grievances, unfair treatment, or dismissal</b>.",
 ex:"Factory workers form a union to ask for higher salary, overtime pay, and safer working conditions."},
l8:{type:'learn',pg:[1,2],title:"Certification Election & Voters",
 body:"A <b>certification election</b> is a <b>secret voting process</b> where employees choose who will represent them. It determines the <b>exclusive bargaining agent (union)</b>, or simply <b>'a union or no union'</b>.<ul><li><b>Qualified voter</b>: allowed to vote; must be part of the <b>bargaining unit</b> (e.g., regular rank-and-file).</li><li><b>Unqualified voter</b>: NOT allowed; usually <b>managerial</b> and <b>confidential</b> employees, because they represent management, not labor.</li><li><b>Optional (challenged) voter</b>: eligibility is <b>questionable</b>; votes <b>conditionally</b> in a <b>sealed envelope</b>, counted <b>only if it affects the result</b>.</li></ul>",
 ex:"Qualified = sure vote. Unqualified = no vote. Optional = 'maybe' vote (subject to validation)."},

q19:{type:'single',pg:[1,2],prompt:"A certification election is:",

q20:{type:'single',pg:[2],prompt:"Why are managerial and confidential employees UNQUALIFIED voters?",

q21:{type:'single',pg:[2],prompt:"A challenged voter's ballot goes in a sealed envelope. When is it counted?",

l9:{type:'learn',pg:[2,4],title:"Bargaining Unit vs Bargaining Agent",
 body:"<b>Bargaining unit</b>: the <b>group of employees</b> legally recognized as represented by a union for collective bargaining. Focus question: <b>'WHO are included?'</b> Usually employees with <b>similar jobs or interests</b>; <b>managers and supervisors are usually excluded</b>. It determines who votes in the certification election, who is covered by the CBA, and the scope of union representation.<br><br><b>Bargaining agent</b>: the <b>official union chosen by employees through a certification election</b>. It is the <b>only union allowed to negotiate</b> with the employer. 'The official voice of the workers.'",
 ex:"All production workers in a factory = bargaining unit. If several unions exist, the one that wins the election = bargaining agent."},
l10:{type:'learn',pg:[3,4],title:"CBA & Union Status",
 body:"A <b>CBA</b> (Collective Bargaining Agreement) is a <b>written agreement between the employer and the employees' union</b>, made after negotiating wages, working hours, benefits, and other conditions.<br><br><b>Union status:</b> Before election → <b>Contending union</b>. After winning → <b>Bargaining agent</b>. During negotiation → <b>Bargaining union</b>. After CBA is signed → <b>Contracting union</b>.<br><br><b>CBA posting rule:</b> post in <b>at least 2 visible places</b>, <b>at least 5 days before ratification</b>. The <b>employer and the union</b> are responsible. Not posting = <b>fatal defect</b> (violates the employees' <b>right to information</b>)."},
q24:{type:'single',pg:[2],prompt:"'WHO are included in the union representation?' is the focus question of the:",
 choices:["Bargaining unit","Bargaining agent","CBA","Grievance machinery"],ans:[0],why:"Bargaining unit = 'Who's inside.'"},
q25:{type:'single',pg:[4],prompt:"Several unions compete. The one that wins the certification election becomes the:",
 choices:["Bargaining agent","Contending union","Bargaining unit","Contracting union"],ans:[0],why:"Winner = bargaining agent, the only union allowed to negotiate with the employer."},
q26:{type:'single',pg:[3,4],prompt:"Put the union status in the right order:",

 why:"Before election: contending. Won: bargaining agent. Negotiating: bargaining union. CBA signed: contracting union."},
q27:{type:'single',pg:[4],prompt:"The CBA must be posted in at least ___ visible places, at least ___ days before ratification.",

q28:{type:'single',pg:[4],prompt:"If the CBA is NOT posted, it is a:",

q29:{type:'single',pg:[3],prompt:"A CBA is a written agreement between:",

q30:{type:'single',pg:[16],prompt:"A 'yellow dog contract' (employee promises not to join, form, or help any union) is:",

q31:{type:'single',pg:[2],prompt:"Who is usually EXCLUDED from a rank-and-file bargaining unit?",

l11:{type:'learn',pg:[3,25],title:"Grievances & Dispute Handling",
 body:"A <b>grievance</b> is an <b>employee complaint</b> about something unfair or wrong at work: salary issues (underpayment, delayed pay), unfair supervisor, unequal workload, harassment, promotion or scheduling issues.<br><b>Dispute handling</b> resolves conflicts: employee vs employer, employee vs employee, union vs management.<br><b>Process:</b> employee files complaint → HR investigates → both sides heard → resolution (settlement, correction, disciplinary action) → follow-up.<br><b>Goal:</b> fairness, peace at work, preventing escalation.<br><b>Grievance machinery</b>: the <b>formal procedure</b> for settling workplace complaints, usually <b>based on the CBA</b>."},
l12:{type:'learn',pg:[3,25,26],title:"Compliance, NCMB & Bystander Rule",
 body:"<b>Labor laws compliance</b>: following all government labor laws: minimum wage, proper hours (8-hour rule, OT pay), holiday and night differential pay, SSS/PhilHealth/Pag-IBIG, proper termination, anti-discrimination and safety. It protects employees, prevents lawsuits and penalties, maintains credibility, and ensures ethical HR.<br><br><b>NCMB</b> (National Conciliation and Mediation Board): a <b>DOLE-attached agency</b> that helps prevent and settle labor disputes peacefully through <b>conciliation and mediation</b>.<br><br><b>Bystander rule (your notes)</b>: an employee not directly involved in a dispute should <b>observe, not interfere</b>.<br><i>Heads up: in the actual Labor Code (Art. 271), the bystander is the <b>employer</b> in a certification election. It can't interfere or oppose the petition.</i>"},
q32:{type:'single',pg:[3],prompt:"Put the dispute handling process in order:",
 choices:["Complaint filed → HR investigates → Both sides heard → Resolution → Follow-up","HR investigates → Resolution → Complaint filed → Follow-up → Both sides heard","Resolution → Complaint filed → Both sides heard → HR investigates → Follow-up","Both sides heard → Complaint filed → Resolution → HR investigates → Follow-up"],ans:[0],
 why:"File → investigate → hear both sides → resolve → follow up."},
q33:{type:'single',pg:[3],prompt:"Which is NOT a common grievance?",
 choices:["Getting 13th month pay on time","Delayed pay","Unfair treatment by a supervisor","Unequal workload"],ans:[0],why:"Getting paid on time is compliance, not a complaint."},
q34:{type:'single',pg:[25,26],prompt:"Which DOLE-attached agency settles disputes through conciliation and mediation?",

q35:{type:'single',pg:[25],prompt:"Grievance machinery is usually based on the:",

q36:{type:'single',pg:[25,26],prompt:"According to YOUR NOTES, the Bystander Rule says:",
